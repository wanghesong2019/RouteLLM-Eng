<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>RouteLLM 配置 · 运行时热更新</title>
<style>
  :root {
    --bg:#0f1117; --card:#1a1d26; --border:#2a2f3a; --fg:#e6e8ee;
    --dim:#8b93a7; --accent:#4d9fff; --ok:#4dd4a0; --warn:#ffc857; --err:#ff7a59;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--border);
  }
  h1 { font-size:18px; margin:0; font-weight:600; }
  h1 span { color:var(--accent); }
  .tabs { display:flex; gap:8px; }
  .tabs a {
    color:var(--dim); text-decoration:none; padding:6px 14px;
    border:1px solid var(--border); border-radius:6px; font-size:13px;
  }
  .tabs a.active { color:var(--accent); border-color:var(--accent); }
  .tabs a:hover { color:var(--fg); }
  main { padding:24px; max-width:900px; }
  .banner {
    padding:12px 16px; border-radius:8px; margin-bottom:20px;
    border:1px solid var(--border); background:var(--card); font-size:13px;
  }
  .banner.ok   { border-color:var(--ok);   color:var(--ok); }
  .banner.err  { border-color:var(--err);  color:var(--err); }
  .banner.warn { border-color:var(--warn); color:var(--warn); }
  .banner code { color:var(--fg); background:#0b0d12; padding:2px 6px; border-radius:4px; }
  .banner .body { color:var(--fg); }
  fieldset {
    border:1px solid var(--border); border-radius:10px; background:var(--card);
    padding:18px; margin:0 0 18px;
  }
  fieldset.tier-strong { border-left:3px solid var(--accent); }
  fieldset.tier-weak   { border-left:3px solid var(--warn); }
  legend { color:var(--dim); font-size:13px; padding:0 8px; }
  .row { display:grid; grid-template-columns:150px 1fr; gap:12px; align-items:center; margin-bottom:12px; }
  .row label { color:var(--dim); font-size:13px; }
  .row input {
    width:100%; padding:8px 12px; background:#0b0d12; color:var(--fg);
    border:1px solid var(--border); border-radius:6px; font-size:13px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .row input:focus { outline:none; border-color:var(--accent); }
  .row .hint { grid-column:2; color:var(--dim); font-size:11px; margin-top:-6px; }
  .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .tier-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  button {
    padding:9px 18px; border-radius:6px; cursor:pointer; font-size:13px;
    border:1px solid var(--border); background:var(--card); color:var(--fg);
  }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#04121f; font-weight:600; }
  button.primary:hover:not(:disabled) { opacity:.88; color:#04121f; }
  button.small { padding:6px 12px; font-size:12px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .meta { color:var(--dim); font-size:12px; margin-top:14px; }
  .spinner { display:inline-block; width:12px; height:12px; border:2px solid var(--border);
             border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ro { color:var(--dim); font-size:12px; }
  .changed { color:var(--ok); font-size:13px; }
  .status { font-size:13px; }
  .status.err { color:var(--err); }
  .status.ok  { color:var(--ok); }
  .status.dim { color:var(--dim); }
  .tag { font-size:11px; padding:2px 8px; border-radius:10px; border:1px solid var(--border); color:var(--dim); }
  .tag.global { border-color:var(--warn); color:var(--warn); }
  .tag.own    { border-color:var(--ok);   color:var(--ok); }
  .divider { border:0; border-top:1px solid var(--border); margin:16px 0; }
</style>
</head>
<body>
<header>
  <h1>RouteLLM <span>配置</span></h1>
  <div class="tabs">
    <a href="/dashboard">监控面板</a>
    <a href="/config" class="active">运行时配置</a>
  </div>
</header>

<main>
  <div id="banner" class="banner">
    正在加载当前配置… <span class="spinner"></span>
  </div>

  <form id="cfg-form" onsubmit="return false;">
    <fieldset class="tier-strong">
      <legend>强模型（复杂问题走这里）</legend>
      <div class="row">
        <label for="strong_model">模型名</label>
        <input id="strong_model" placeholder="deepseek-ai/DeepSeek-V4-Pro">
        <div class="hint">填<b>原始模型名</b>即可，无需 <code>openai/</code> 前缀（网关调用时自动补）</div>
      </div>
      <div class="row">
        <label for="strong_api_base">API Base URL</label>
        <input id="strong_api_base" placeholder="留空 = 使用下面的全局地址">
        <div class="hint" id="strong_base_hint"></div>
      </div>
      <div class="row">
        <label for="strong_api_key">API Key</label>
        <input id="strong_api_key" type="password" placeholder="留空 = 不修改">
        <div class="hint" id="strong_key_hint"></div>
      </div>
      <div class="tier-actions">
        <button class="small" id="btn-verify-strong" onclick="verify('strong')">测试强模型连接</button>
        <span class="status dim" id="status-strong"></span>
      </div>
    </fieldset>

    <fieldset class="tier-weak">
      <legend>弱模型（简单问题走这里）</legend>
      <div class="row">
        <label for="weak_model">模型名</label>
        <input id="weak_model" placeholder="deepseek-ai/DeepSeek-V4-Flash">
        <div class="hint">只填一个模型名时，所有请求都会走已填的那个（不会报错）</div>
      </div>
      <div class="row">
        <label for="weak_api_base">API Base URL</label>
        <input id="weak_api_base" placeholder="留空 = 使用下面的全局地址">
        <div class="hint" id="weak_base_hint"></div>
      </div>
      <div class="row">
        <label for="weak_api_key">API Key</label>
        <input id="weak_api_key" type="password" placeholder="留空 = 不修改">
        <div class="hint" id="weak_key_hint"></div>
      </div>
      <div class="tier-actions">
        <button class="small" id="btn-verify-weak" onclick="verify('weak')">测试弱模型连接</button>
        <span class="status dim" id="status-weak"></span>
      </div>
    </fieldset>

    <fieldset>
      <legend>全局兜底（上面两侧留空时使用这里）</legend>
      <div class="row">
        <label for="api_base">API Base URL</label>
        <input id="api_base" placeholder="https://api.example.com/v1">
        <div class="hint">强弱两侧都留空时，都用这个地址（旧配置的兼容用法）</div>
      </div>
      <div class="row">
        <label for="api_key">API Key</label>
        <input id="api_key" type="password" placeholder="留空 = 不修改">
        <div class="hint" id="global_key_hint"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>只读项（改动需重启网关）</legend>
      <div class="ro">
        路由器类型（remote_bert 等）、路由阈值、路由模型路径 —— 这些变更涉及
        加载模型与数据集，不支持热更新。<br>
        面板端口 / metrics 路径等由容器环境变量控制。
      </div>
    </fieldset>

    <div class="actions">
      <button class="primary" id="btn-save" onclick="save()">保存并立即生效</button>
      <button id="btn-reload" onclick="load()">重新加载</button>
    </div>
    <div class="status dim" id="status-save" style="margin-top:10px"></div>

    <div class="meta" id="meta"></div>
  </form>
</main>

<script>
let CURRENT = {};        // 服务端返回的配置（密钥均为掩码）
// 各输入框「原始值」快照：用于判断哪些字段真正有变化
let SNAPSHOT = {};

const TIER_FIELDS = {
  strong: ['strong_model', 'strong_api_base'],
  weak:   ['weak_model', 'weak_api_base'],
};
// 密钥字段：留空 = 不修改（避免误清空）
const SECRET_FIELDS = ['api_key', 'strong_api_key', 'weak_api_key'];

function setBanner(kind, html) {
  const b = document.getElementById('banner');
  b.className = 'banner' + (kind ? ' ' + kind : '');
  b.innerHTML = html;
}

function setStatus(id, html, kind) {
  const s = document.getElementById(id);
  s.className = 'status ' + (kind || 'dim');
  s.innerHTML = html;
}

function maskHint(value) {
  return value ? '当前值： <code>' + value + '</code>' : '当前未设置';
}

// 把 4xx 响应体（FastAPI 的 {detail: ...} 或网关的 {error: {message}}）转成可读文本
function fmtDetail(d) {
  if (!d) return '未知错误';
  if (typeof d === 'string') return d;
  if (d.detail !== undefined) {
    const t = d.detail;
    if (typeof t === 'string') return t;
    if (t && t.error && t.error.message) return t.error.message;
    return JSON.stringify(t);
  }
  if (d.error && d.error.message) return d.error.message;
  return JSON.stringify(d);
}

async function load() {
  setBanner('', '正在加载当前配置… <span class="spinner"></span>');
  try {
    const r = await fetch('/api/config');
    const d = await r.json();

    // 4xx（如 401 鉴权失败）现在保留状态码返回：detail 里是网关的原始说明
    if (!r.ok) {
      setBanner('err', '<b>无法读取配置 (HTTP ' + r.status + ')</b><br>' +
        '<span class="body">' + fmtDetail(d) + '</span>' +
        (r.status === 401
          ? '<br><span class="ro">网关拒绝了鉴权：请检查面板容器的 ROUTELLM_GATEWAY_API_KEY</span>'
          : ''));
      return;
    }

    if (d.proxy_error) {
      setBanner('err',
        '<b>无法读取配置</b><br><span class="body">' + d.proxy_error + '</span>' +
        (d.proxy_hint ? '<br><span class="ro">' + d.proxy_hint + '</span>' : ''));
      return;
    }
    CURRENT = d;

    // 非密钥字段：直接回填
    for (const f of ['strong_model', 'weak_model', 'strong_api_base',
                     'weak_api_base', 'api_base']) {
      const el = document.getElementById(f);
      if (el) el.value = d[f] || '';
    }

    // 密钥字段：输入框留空，掩码放 placeholder（留空提交 = 不修改）
    for (const f of SECRET_FIELDS) {
      const el = document.getElementById(f);
      if (el) { el.value = ''; el.placeholder = d[f] || '留空 = 不修改'; }
    }

    // 快照：用于「只提交有变化的字段」
    SNAPSHOT = {};
    for (const f of ['strong_model', 'weak_model', 'strong_api_base',
                     'weak_api_base', 'api_base']) {
      SNAPSHOT[f] = (d[f] || '');
    }

    // 提示：各侧凭据来源（该侧覆盖 or 全局兜底）
    document.getElementById('strong_base_hint').innerHTML =
      d.strong_api_base ? '强模型将使用这个地址' : '强模型使用下方全局地址';
    document.getElementById('weak_base_hint').innerHTML =
      d.weak_api_base ? '弱模型将使用这个地址' : '弱模型使用下方全局地址';
    document.getElementById('strong_key_hint').innerHTML = maskHint(d.strong_api_key);
    document.getElementById('weak_key_hint').innerHTML = maskHint(d.weak_api_key);
    document.getElementById('global_key_hint').innerHTML = maskHint(d.api_key);

    // 单模型模式提示
    if (d.single_model_mode) {
      setBanner('warn',
        '<b>单模型模式</b>：只配置了一个模型，所有请求都会走 ' +
        '<code>' + (d.effective_strong_model || '') + '</code>。' +
        '<br><span class="ro">想让强/弱分别走不同模型，把另一个模型名也填上即可。</span>');
    } else {
      setBanner('ok', '配置已加载 · <b>修改后点击「保存」立即生效，无需重启网关</b>');
    }

    document.getElementById('meta').textContent =
      '可编辑字段: ' + (d.editable_fields || []).join(', ');
  } catch (e) {
    setBanner('err', '<b>加载失败</b>: <span class="body">' + e.message + '</span>');
  }
}

function payload() {
  const p = {};
  // 普通字段：与快照比对，只提交有变化的
  for (const f of ['strong_model', 'weak_model', 'strong_api_base',
                   'weak_api_base', 'api_base']) {
    const el = document.getElementById(f);
    if (!el) continue;
    const v = el.value.trim();
    if (v !== (SNAPSHOT[f] || '')) p[f] = v;   // 空字符串 = 清空该侧（回落全局）
  }
  // 密钥：只有填了才提交（留空 = 不修改）
  for (const f of SECRET_FIELDS) {
    const el = document.getElementById(f);
    const v = el ? el.value.trim() : '';
    if (v) p[f] = v;
  }
  return p;
}

async function save() {
  const p = payload();
  if (Object.keys(p).length === 0) {
    setStatus('status-save', '没有需要提交的变更', 'dim');
    return;
  }
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  setStatus('status-save', '提交中… <span class="spinner"></span>', 'dim');
  try {
    const r = await fetch('/api/config', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(p),
    });
    const d = await r.json();

    // 4xx 客户端错误（参数非法 / 未知字段）现在保留状态码
    if (!r.ok) {
      setStatus('status-save', '被拒绝 (HTTP ' + r.status + '): ' + fmtDetail(d), 'err');
      return;
    }
    if (d.proxy_error) {
      setStatus('status-save', '失败: ' + d.proxy_error, 'err');
      return;
    }
    if (d.ok === false) {
      setStatus('status-save', '未生效: ' + (d.message || '未知原因'), 'err');
      return;
    }
    const ch = (d.changed || []).join(', ');
    setStatus('status-save', '已生效: ' + (ch || '无变化') + '（无需重启）', 'ok');
    await load();
  } catch (e) {
    setStatus('status-save', '提交失败: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

async function verify(tier) {
  const btn = document.getElementById('btn-verify-' + tier);
  const sid = 'status-' + tier;
  btn.disabled = true;
  setStatus(sid, '测试中… <span class="spinner"></span>', 'dim');
  try {
    const r = await fetch('/api/config/verify?tier=' + encodeURIComponent(tier),
                          {method: 'POST'});
    const d = await r.json();

    // 4xx（如非法 tier / 鉴权失败）保留状态码 —— 与"连接不通"是不同性质的错误
    if (!r.ok) {
      setStatus(sid, '请求被拒绝 (HTTP ' + r.status + '): ' + fmtDetail(d), 'err');
      return;
    }
    if (d.proxy_error) {
      setStatus(sid, '转发失败: ' + d.proxy_error, 'err');
      return;
    }
    const pr = d.probed || {};
    // 明示：测的是哪一侧 / 哪个模型 / 哪个地址 / 凭据来源
    const tag = pr.source === 'global'
      ? ' <span class="tag global">凭据来自全局兜底</span>'
      : ' <span class="tag own">凭据来自本侧配置</span>';
    const who = '「' + (pr.model || '(未配置)') + '」 @ ' + (pr.api_base || '(未配置)');
    if (d.ok) {
      setStatus(sid, '✓ ' + who + ' 可达 · ' + (d.detail || '') + tag, 'ok');
    } else {
      setStatus(sid, '✗ ' + who + ' 不可达 · ' + (d.detail || '') + tag, 'err');
    }
  } catch (e) {
    setStatus(sid, '测试失败: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

load();
</script>
</body>
</html>
