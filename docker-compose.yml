# RouteLLM 部署编排（网关 + Dashboard 双容器）
#
# 架构：
#   routellm 容器    容器内 6060  →  宿主机 6060   路由网关（/v1/*，需 API key）
#   dashboard 容器   容器内 8080  →  宿主机 8092   监控面板（免鉴权）
#
#   两容器共享 metrics 卷（SQLite），prometheus 从网关 /metrics 抓取。
#
# 容器内端口互不冲突（不同网络命名空间），宿主机端口按实际情况定。
#
# 启动：
#   docker compose up -d
#   docker compose logs -f routellm
#
# 前置：
#   1. host 上推理服务须先运行（services/inference_server.py，端口 6070）
#   2. .env 文件需含 ROUTELLM_API_KEY（下游 LLM key）与
#      ROUTELLM_GATEWAY_API_KEY（本网关对外 key）

services:
  routellm:
    build:
      context: .
      dockerfile: Dockerfile
    image: routellm-eng:dev
    container_name: routellm-deploy
    restart: unless-stopped

    ports:
      # 网关对外暴露（供 Hermes Agent 等客户端调用）；鉴权由
      # ROUTELLM_GATEWAY_API_KEY 保障。仅内网使用时改为 "127.0.0.1:6060:6060"
      - "0.0.0.0:6060:6060"

    environment:
      # ---- 下游 LLM provider（OpenAI 兼容）----
      # 模型名必须带 provider 前缀（如 openai/deepseek-ai/DeepSeek-V4-Pro），
      # 裸模型名会触发 litellm BadRequestError（见 docs/CHANGELOG.md 问题6）
      ROUTELLM_STRONG_MODEL: "${ROUTELLM_STRONG_MODEL:?需要设置强模型}"
      ROUTELLM_WEAK_MODEL: "${ROUTELLM_WEAK_MODEL:?需要设置弱模型}"
      ROUTELLM_API_BASE: "${ROUTELLM_API_BASE:?需要设置下游 api_base}"
      ROUTELLM_API_KEY: "${ROUTELLM_API_KEY:?需要设置下游 api_key}"

      # ---- 本网关对外鉴权 key（逗号分隔支持多 key；不设则不鉴权）----
      ROUTELLM_GATEWAY_API_KEY: "${ROUTELLM_GATEWAY_API_KEY:-}"

      # ---- 路由模型推理服务（host 侧）----
      ROUTELLM_INFERENCE_URL: "${ROUTELLM_INFERENCE_URL:-http://host.docker.internal:6070}"
      ROUTELLM_SW_RANKING_INFERENCE_URL: "${ROUTELLM_SW_RANKING_INFERENCE_URL:-http://host.docker.internal:6071}"

      # ---- 启用的路由器 ----
      ROUTELLM_ROUTERS: "${ROUTELLM_ROUTERS:-remote_bert}"

      # ---- 监控（指标落共享卷，由 dashboard 容器读取）----
      ROUTELLM_METRICS_ENABLED: "1"
      ROUTELLM_METRICS_DB: "/data/metrics.db"

    volumes:
      # metrics SQLite 共享卷（网关写、dashboard 读）
      # 用宿主机目录而非命名卷 —— 命名卷默认 root 拥有，容器内非 root 用户
      # 会 "unable to open database file"（实测踩过）。宿主机目录可预先
      # chmod 777 / chown 1000。
      - ${ROUTELLM_METRICS_HOST_DIR:?需设置 metrics 宿主机目录}:/data

    extra_hosts:
      # Linux 上 host.docker.internal 不会自动解析，需显式映射
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6060/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - routellm-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: routellm-dashboard:dev
    container_name: routellm-dashboard
    restart: unless-stopped

    ports:
      # 面板独立端口（与网关差异化）：宿主机 8092 → 容器内 8080
      - "0.0.0.0:8092:8080"

    environment:
      ROUTELLM_METRICS_DB: "/data/metrics.db"
      ROUTELLM_DASHBOARD_PORT: "8080"
      ROUTELLM_DASHBOARD_HOST: "0.0.0.0"

    volumes:
      # 只读挂载同一 metrics 目录 —— 面板只读不写（避免与网关争 SQLite 写锁）
      - ${ROUTELLM_METRICS_HOST_DIR:?需设置 metrics 宿主机目录}:/data:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    depends_on:
      - routellm

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - routellm-net

networks:
  routellm-net:
    driver: bridge
    name: routellm-net
